[package]
name = "oidc-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
openidconnect = "4.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
