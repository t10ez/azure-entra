[package]
name = "saml-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
samael = "0.0.22"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
